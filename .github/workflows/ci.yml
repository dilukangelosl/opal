name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-bindgen-cli@0.2.129 }
      - run: cargo test --workspace
      - name: Rebuild browser artifacts and check they are committed
        run: |
          ./build-web.sh
          git diff --stat --exit-code -- packages/opal-sprites/src/runtime.js web/opal.js || (echo "::error::run ./build-web.sh and commit the result" && exit 1)
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Test and pack the npm package
        working-directory: packages/opal-sprites
        run: |
          npm test
          npm pack --dry-run
